name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --all-targets --all-features
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Counterexample CLI smoke test
        shell: bash
        run: |
          set +e
          output="$(cargo run --quiet -- run mutex-bug)"
          status=$?
          set -e

          printf '%s\n' "$output"
          test "$status" -eq 1
          grep -Fq "status: VIOLATION" <<<"$output"
          grep -Fq "violated invariant: mutual-exclusion" <<<"$output"
          grep -Fq -- "--p1:request-->" <<<"$output"
          grep -Fq -- "--p1:enter-->" <<<"$output"
          grep -Fq -- "--p2:request-->" <<<"$output"
          grep -Fq -- "--p2:enter-->" <<<"$output"
          grep -Fq "MutexState { p1: Critical, p2: Critical }" <<<"$output"
      - name: Bounded exploration CLI smoke test
        shell: bash
        run: |
          safe_output="$(cargo run --quiet -- run counter --max-states 4 --max-transitions 3 --max-depth 3)"
          printf '%s\n' "$safe_output"
          grep -Fq "status: SAFE" <<<"$safe_output"

          set +e
          bounded_output="$(cargo run --quiet -- run mutex-bug --max-depth 3)"
          bounded_status=$?
          set -e

          printf '%s\n' "$bounded_output"
          test "$bounded_status" -eq 3
          grep -Fq "status: INCONCLUSIVE" <<<"$bounded_output"
          grep -Fq "inconclusive reason: depth limit reached (max 3)" <<<"$bounded_output"
          if grep -Fq "status: SAFE" <<<"$bounded_output"; then
            exit 1
          fi
      - name: Peterson CLI integration test
        shell: bash
        run: |
          safe_output="$(cargo run --quiet -- run peterson)"
          printf '%s\n' "$safe_output"
          grep -Fq "model: peterson-mutex" <<<"$safe_output"
          grep -Fq "status: SAFE" <<<"$safe_output"
          grep -Fq "discovered states: 20" <<<"$safe_output"
          grep -Fq "explored transitions: 34" <<<"$safe_output"

          set +e
          buggy_output="$(cargo run --quiet -- run peterson-bug)"
          buggy_status=$?
          set -e

          printf '%s\n' "$buggy_output"
          test "$buggy_status" -eq 1
          grep -Fq "model: peterson-lost-intent" <<<"$buggy_output"
          grep -Fq "status: VIOLATION" <<<"$buggy_output"
          grep -Fq "violated invariant: mutual-exclusion" <<<"$buggy_output"
          grep -Fq -- "--p0:set-flag-->" <<<"$buggy_output"
          grep -Fq -- "--p0:set-turn-->" <<<"$buggy_output"
          grep -Fq -- "--p0:enter-->" <<<"$buggy_output"
          grep -Fq -- "--p1:set-flag-->" <<<"$buggy_output"
          grep -Fq -- "--p1:set-turn-->" <<<"$buggy_output"
          grep -Fq -- "--p1:enter-->" <<<"$buggy_output"
          grep -Fq "p0: Critical, p1: Critical" <<<"$buggy_output"
