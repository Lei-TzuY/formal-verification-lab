name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --all-targets --all-features
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Counterexample CLI smoke test
        shell: bash
        run: |
          set +e
          output="$(cargo run --quiet -- run mutex-bug)"
          status=$?
          set -e

          printf '%s\n' "$output"
          test "$status" -eq 1
          grep -Fq "status: VIOLATION" <<<"$output"
          grep -Fq "violated invariant: mutual-exclusion" <<<"$output"
          grep -Fq -- "--p1:request-->" <<<"$output"
          grep -Fq -- "--p1:enter-->" <<<"$output"
          grep -Fq -- "--p2:request-->" <<<"$output"
          grep -Fq -- "--p2:enter-->" <<<"$output"
          grep -Fq "MutexState { p1: Critical, p2: Critical }" <<<"$output"
      - name: Bounded exploration CLI smoke test
        shell: bash
        run: |
          safe_output="$(cargo run --quiet -- run counter --max-states 4 --max-transitions 3 --max-depth 3)"
          printf '%s\n' "$safe_output"
          grep -Fq "status: SAFE" <<<"$safe_output"
          grep -Fq "max depth reached: 3" <<<"$safe_output"
          grep -Fq "  increment: 3" <<<"$safe_output"

          set +e
          bounded_output="$(cargo run --quiet -- run mutex-bug --max-depth 3)"
          bounded_status=$?
          set -e

          printf '%s\n' "$bounded_output"
          test "$bounded_status" -eq 3
          grep -Fq "status: INCONCLUSIVE" <<<"$bounded_output"
          grep -Fq "max depth reached: 3" <<<"$bounded_output"
          grep -Fq "inconclusive reason: depth limit reached (max 3)" <<<"$bounded_output"
          if grep -Fq "status: SAFE" <<<"$bounded_output"; then
            exit 1
          fi
      - name: Peterson CLI integration test
        shell: bash
        run: |
          safe_output="$(cargo run --quiet -- run peterson)"
          printf '%s\n' "$safe_output"
          grep -Fq "model: peterson-mutex" <<<"$safe_output"
          grep -Fq "status: SAFE" <<<"$safe_output"
          grep -Fq "discovered states: 20" <<<"$safe_output"
          grep -Fq "explored transitions: 34" <<<"$safe_output"
          grep -Fq "max depth reached: 6" <<<"$safe_output"
          grep -Fq "  p0:enter: 2" <<<"$safe_output"
          grep -Fq "  p0:exit: 3" <<<"$safe_output"
          grep -Fq "  p0:set-flag: 6" <<<"$safe_output"
          grep -Fq "  p0:set-turn: 6" <<<"$safe_output"
          grep -Fq "  p1:enter: 2" <<<"$safe_output"
          grep -Fq "  p1:exit: 3" <<<"$safe_output"
          grep -Fq "  p1:set-flag: 6" <<<"$safe_output"
          grep -Fq "  p1:set-turn: 6" <<<"$safe_output"

          set +e
          buggy_output="$(cargo run --quiet -- run peterson-bug)"
          buggy_status=$?
          set -e

          printf '%s\n' "$buggy_output"
          test "$buggy_status" -eq 1
          grep -Fq "model: peterson-lost-intent" <<<"$buggy_output"
          grep -Fq "status: VIOLATION" <<<"$buggy_output"
          grep -Fq "violated invariant: mutual-exclusion" <<<"$buggy_output"
          grep -Fq -- "--p0:set-flag-->" <<<"$buggy_output"
          grep -Fq -- "--p0:set-turn-->" <<<"$buggy_output"
          grep -Fq -- "--p0:enter-->" <<<"$buggy_output"
          grep -Fq -- "--p1:set-flag-->" <<<"$buggy_output"
          grep -Fq -- "--p1:set-turn-->" <<<"$buggy_output"
          grep -Fq -- "--p1:enter-->" <<<"$buggy_output"
          grep -Fq "p0: Critical, p1: Critical" <<<"$buggy_output"
      - name: Differential reduction CLI audit
        shell: bash
        run: |
          output="$(cargo run --quiet -- reduce commuting-counters)"
          printf '%s\n' "$output"
          grep -Fq "model: commuting-counters" <<<"$output"
          grep -Fq "reduction audit: MATCH" <<<"$output"
          grep -Fq "independence pairs: 1" <<<"$output"
          grep -Fq "exhaustive status: SAFE" <<<"$output"
          grep -Fq "exhaustive states: 9" <<<"$output"
          grep -Fq "exhaustive transitions: 12" <<<"$output"
          grep -Fq "reduced status: SAFE" <<<"$output"
          grep -Fq "reduced states: 9" <<<"$output"
          grep -Fq "reduced transitions: 8" <<<"$output"
          grep -Fq "pruned transitions: 4" <<<"$output"
      - name: Reachability property CLI integration test
        shell: bash
        run: |
          reachable_output="$(cargo run --quiet -- reach counter-three)"
          printf '%s\n' "$reachable_output"
          grep -Fq "model: bounded-counter" <<<"$reachable_output"
          grep -Fq "property: reaches-three" <<<"$reachable_output"
          grep -Fq "reachability: REACHABLE" <<<"$reachable_output"
          grep -Fq "discovered states: 4" <<<"$reachable_output"
          grep -Fq "checked states: 4" <<<"$reachable_output"
          grep -Fq "explored transitions: 3" <<<"$reachable_output"
          grep -Fq "max depth reached: 3" <<<"$reachable_output"
          test "$(grep -Fc -- '--increment-->' <<<"$reachable_output")" -eq 3
          grep -Fq "CounterState { value: 3 }" <<<"$reachable_output"

          set +e
          unreachable_output="$(cargo run --quiet -- reach counter-four)"
          unreachable_status=$?
          set -e

          printf '%s\n' "$unreachable_output"
          test "$unreachable_status" -eq 4
          grep -Fq "property: reaches-four" <<<"$unreachable_output"
          grep -Fq "reachability: UNREACHABLE" <<<"$unreachable_output"
          grep -Fq "discovered states: 4" <<<"$unreachable_output"
          grep -Fq "checked states: 4" <<<"$unreachable_output"
          grep -Fq "explored transitions: 3" <<<"$unreachable_output"
          grep -Fq "witness: none (reachable graph exhausted)" <<<"$unreachable_output"
      - name: Deadlock terminal policy CLI integration test
        shell: bash
        run: |
          free_output="$(cargo run --quiet -- deadlock counter-terminal-ok)"
          printf '%s\n' "$free_output"
          grep -Fq "model: bounded-counter" <<<"$free_output"
          grep -Fq "property: counter-completion-is-terminal" <<<"$free_output"
          grep -Fq "deadlock: DEADLOCK_FREE" <<<"$free_output"
          grep -Fq "discovered states: 4" <<<"$free_output"
          grep -Fq "checked states: 4" <<<"$free_output"
          grep -Fq "explored transitions: 3" <<<"$free_output"
          grep -Fq "max depth reached: 3" <<<"$free_output"
          grep -Fq "deadlock witness: none (reachable graph exhausted)" <<<"$free_output"

          set +e
          found_output="$(cargo run --quiet -- deadlock counter-terminal-forbidden)"
          found_status=$?
          set -e

          printf '%s\n' "$found_output"
          test "$found_status" -eq 5
          grep -Fq "property: no-terminal-state-is-allowed" <<<"$found_output"
          grep -Fq "deadlock: DEADLOCK_FOUND" <<<"$found_output"
          grep -Fq "discovered states: 4" <<<"$found_output"
          grep -Fq "checked states: 4" <<<"$found_output"
          grep -Fq "explored transitions: 3" <<<"$found_output"
          test "$(grep -Fc -- '--increment-->' <<<"$found_output")" -eq 3
          grep -Fq "CounterState { value: 3 }" <<<"$found_output"
      - name: SCC recurrence CLI integration test
        shell: bash
        run: |
          acyclic_output="$(cargo run --quiet -- scc counter)"
          printf '%s\n' "$acyclic_output"
          grep -Fq "model: bounded-counter" <<<"$acyclic_output"
          grep -Fq "recurrence: ACYCLIC" <<<"$acyclic_output"
          grep -Fq "discovered states: 4" <<<"$acyclic_output"
          grep -Fq "explored transitions: 3" <<<"$acyclic_output"
          grep -Fq "scc count: 4" <<<"$acyclic_output"
          grep -Fq "cyclic scc count: 0" <<<"$acyclic_output"
          grep -Fq "cycle witness: none" <<<"$acyclic_output"

          cyclic_output="$(cargo run --quiet -- scc traffic-light)"
          printf '%s\n' "$cyclic_output"
          grep -Fq "model: traffic-light" <<<"$cyclic_output"
          grep -Fq "recurrence: CYCLIC" <<<"$cyclic_output"
          grep -Fq "discovered states: 3" <<<"$cyclic_output"
          grep -Fq "explored transitions: 3" <<<"$cyclic_output"
          grep -Fq "scc count: 1" <<<"$cyclic_output"
          grep -Fq "cyclic scc count: 1" <<<"$cyclic_output"
          grep -Fq "cycle component: 0" <<<"$cyclic_output"
          grep -Fq "TrafficLightState { light: Red } [initial]" <<<"$cyclic_output"
          test "$(grep -Fc -- '--advance-->' <<<"$cyclic_output")" -eq 3
      - name: Universal eventuality CLI integration test
        shell: bash
        run: |
          satisfied_output="$(cargo run --quiet -- eventually counter-three)"
          printf '%s\n' "$satisfied_output"
          grep -Fq "model: bounded-counter" <<<"$satisfied_output"
          grep -Fq "property: all-paths-eventually-three" <<<"$satisfied_output"
          grep -Fq "eventuality: SATISFIED" <<<"$satisfied_output"
          grep -Fq "counterexample: none (all maximal executions reach target)" <<<"$satisfied_output"

          set +e
          finite_output="$(cargo run --quiet -- eventually counter-four)"
          finite_status=$?
          set -e
          printf '%s\n' "$finite_output"
          test "$finite_status" -eq 6
          grep -Fq "eventuality: VIOLATED" <<<"$finite_output"
          grep -Fq "counterexample: FINITE_TERMINAL" <<<"$finite_output"
          test "$(grep -Fc -- '--increment-->' <<<"$finite_output")" -eq 3
          grep -Fq "CounterState { value: 3 }" <<<"$finite_output"

          set +e
          infinite_output="$(cargo run --quiet -- eventually traffic-never)"
          infinite_status=$?
          set -e
          printf '%s\n' "$infinite_output"
          test "$infinite_status" -eq 6
          grep -Fq "model: traffic-light" <<<"$infinite_output"
          grep -Fq "eventuality: VIOLATED" <<<"$infinite_output"
          grep -Fq "counterexample: INFINITE_CYCLE" <<<"$infinite_output"
          grep -Fq "TrafficLightState { light: Red } [cycle-entry]" <<<"$infinite_output"
          test "$(grep -Fc -- '--advance-->' <<<"$infinite_output")" -eq 3
      - name: Action response CLI integration test
        shell: bash
        run: |
          satisfied_output="$(cargo run --quiet -- respond request-grant)"
          printf '%s\n' "$satisfied_output"
          grep -Fq "model: request-grant" <<<"$satisfied_output"
          grep -Fq "property: request-eventually-grant" <<<"$satisfied_output"
          grep -Fq "response: SATISFIED" <<<"$satisfied_output"
          grep -Fq "model states: 2" <<<"$satisfied_output"
          grep -Fq "model transitions: 2" <<<"$satisfied_output"
          grep -Fq "product states: 2" <<<"$satisfied_output"
          grep -Fq "product transitions: 2" <<<"$satisfied_output"
          grep -Fq "counterexample: none (every trigger is eventually answered)" <<<"$satisfied_output"

          set +e
          violated_output="$(cargo run --quiet -- respond request-grant-unfair)"
          violated_status=$?
          set -e
          printf '%s\n' "$violated_output"
          test "$violated_status" -eq 7
          grep -Fq "model: request-grant-unfair" <<<"$violated_output"
          grep -Fq "response: VIOLATED" <<<"$violated_output"
          grep -Fq "model states: 2" <<<"$violated_output"
          grep -Fq "model transitions: 3" <<<"$violated_output"
          grep -Fq "product states: 2" <<<"$violated_output"
          grep -Fq "product transitions: 3" <<<"$violated_output"
          grep -Fq "counterexample: PENDING_CYCLE" <<<"$violated_output"
          grep -Fq -- "--request-->" <<<"$violated_output"
          grep -Fq "pending: true" <<<"$violated_output"
          test "$(grep -Fc -- '--wait-->' <<<"$violated_output")" -eq 1
