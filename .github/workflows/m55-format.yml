name: M55 formatter

on:
  push:
    branches:
      - feature/milestone-55-verification-job-manifest

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/milestone-55-verification-job-manifest
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes produced" >&2
            exit 1
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/verification_job.rs tests/verification_job.rs tests/verification_job_cli.rs src/main.rs src/lib.rs
          git commit -m "Apply rustfmt to M55 verification jobs"
          git push origin HEAD:feature/milestone-55-verification-job-manifest
