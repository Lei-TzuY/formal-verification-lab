name: M62 construction

on:
  push:
    branches:
      - feature/milestone-62-action-temporal-jobs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/milestone-62-action-temporal-jobs
          fetch-depth: 0
      - name: Apply guarded source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Manifest family: parser + canonical rendering only. Execution remains elsewhere.
          replace_once(
              "src/verification_job.rs",
              "    PropositionExpression,\n}",
              "    PropositionExpression,\n    ActionTemporal,\n}",
          )
          replace_once(
              "src/verification_job.rs",
              "            Self::PropositionExpression => \"proposition-expression\",\n",
              "            Self::PropositionExpression => \"proposition-expression\",\n            Self::ActionTemporal => \"action-temporal\",\n",
          )
          replace_once(
              "src/verification_job.rs",
              "            \"proposition-expression\" => Some(Self::PropositionExpression),\n",
              "            \"proposition-expression\" => Some(Self::PropositionExpression),\n            \"action-temporal\" => Some(Self::ActionTemporal),\n",
          )
          replace_once(
              "src/verification_job.rs",
              "expected multi-response, safety, exact-state, or proposition-expression",
              "expected multi-response, safety, exact-state, proposition-expression, or action-temporal",
          )

          # Register the isolated adapter module.
          replace_once(
              "src/lib.rs",
              "pub mod verification_execution;\n",
              "pub mod verification_execution;\nmod verification_action_temporal;\n",
          )

          # Structured result: optional backend is serialized only when present, preserving every
          # historical byte sequence; temporal evidence exposes frontend states only.
          replace_once(
              "src/verification_result.rs",
              "    pub analysis: Option<String>,\n    pub outcome: VerificationJobOutcome,\n",
              "    pub analysis: Option<String>,\n    /// Present only for analysis families whose normalized frontend has a stable backend identity.\n    pub backend: Option<String>,\n    pub outcome: VerificationJobOutcome,\n",
          )

          result_path = Path("src/verification_result.rs")
          result = result_path.read_text()
          result, count = re.subn(
              r'(?m)^(\s*)analysis: (None|Some\([^\n]+\)),\n(?!\1backend:)',
              lambda m: f"{m.group(1)}analysis: {m.group(2)},\n{m.group(1)}backend: None,\n",
              result,
          )
          if count < 5:
              raise SystemExit(f"verification_result.rs: expected historical envelope constructors, patched {count}")
          result_path.write_text(result)

          replace_once(
              "src/verification_result.rs",
              "        if let Some(analysis) = self.analysis.as_deref() {\n            field_string(&mut out, \"analysis\", analysis, false);\n        }\n        field_string(&mut out, \"outcome\", self.outcome.as_str(), false);\n",
              "        if let Some(analysis) = self.analysis.as_deref() {\n            field_string(&mut out, \"analysis\", analysis, false);\n        }\n        if let Some(backend) = self.backend.as_deref() {\n            field_string(&mut out, \"backend\", backend, false);\n        }\n        field_string(&mut out, \"outcome\", self.outcome.as_str(), false);\n",
          )
          replace_once(
              "src/verification_result.rs",
              "    ExactStateEventualityInfinite {\n        stem: Vec<VerificationJobStateTraceStep>,\n        cycle: Vec<VerificationJobStateTraceStep>,\n    },\n}",
              "    ExactStateEventualityInfinite {\n        stem: Vec<VerificationJobStateTraceStep>,\n        cycle: Vec<VerificationJobStateTraceStep>,\n    },\n    ActionTemporalFinite {\n        obligation: String,\n        trace: Vec<VerificationJobStateTraceStep>,\n    },\n    ActionTemporalInfinite {\n        obligation: String,\n        stem: Vec<VerificationJobStateTraceStep>,\n        cycle: Vec<VerificationJobStateTraceStep>,\n    },\n}",
          )
          replace_once(
              "src/verification_result.rs",
              "        VerificationJobEvidence::ExactStateEventualityInfinite { stem, cycle } => {\n            out.push('{');\n            field_string(out, \"kind\", \"eventuality_lasso\", true);\n            out.push_str(\",\\\"stem\\\":\");\n            write_state_trace(out, stem);\n            out.push_str(\",\\\"cycle\\\":\");\n            write_state_trace(out, cycle);\n            out.push('}');\n        }\n",
              "        VerificationJobEvidence::ExactStateEventualityInfinite { stem, cycle } => {\n            out.push('{');\n            field_string(out, \"kind\", \"eventuality_lasso\", true);\n            out.push_str(\",\\\"stem\\\":\");\n            write_state_trace(out, stem);\n            out.push_str(\",\\\"cycle\\\":\");\n            write_state_trace(out, cycle);\n            out.push('}');\n        }\n        VerificationJobEvidence::ActionTemporalFinite { obligation, trace } => {\n            out.push('{');\n            field_string(out, \"kind\", \"temporal_finite\", true);\n            field_string(out, \"obligation\", obligation, false);\n            out.push_str(\",\\\"trace\\\":\");\n            write_state_trace(out, trace);\n            out.push('}');\n        }\n        VerificationJobEvidence::ActionTemporalInfinite { obligation, stem, cycle } => {\n            out.push('{');\n            field_string(out, \"kind\", \"temporal_lasso\", true);\n            field_string(out, \"obligation\", obligation, false);\n            out.push_str(\",\\\"stem\\\":\");\n            write_state_trace(out, stem);\n            out.push_str(\",\\\"cycle\\\":\");\n            write_state_trace(out, cycle);\n            out.push('}');\n        }\n",
          )

          # Dispatcher: all action-temporal semantics live in the isolated adapter.
          replace_once(
              "src/verification_job_run.rs",
              "use crate::verification_execution::{\n",
              "use crate::verification_action_temporal::{\n    action_temporal_error, run_action_temporal_job_json,\n};\nuse crate::verification_execution::{\n",
          )
          replace_once(
              "src/verification_job_run.rs",
              "        VerificationJobAnalysis::PropositionExpression => {\n            match run_proposition_expression_job_json(manifest_path, job) {\n                Ok(run) => run,\n                Err(error) => error_run(proposition_expression_error(error)),\n            }\n        }\n",
              "        VerificationJobAnalysis::PropositionExpression => {\n            match run_proposition_expression_job_json(manifest_path, job) {\n                Ok(run) => run,\n                Err(error) => error_run(proposition_expression_error(error)),\n            }\n        }\n        VerificationJobAnalysis::ActionTemporal => {\n            match run_action_temporal_job_json(manifest_path, job) {\n                Ok(run) => run,\n                Err(error) => error_run(action_temporal_error(error)),\n            }\n        }\n",
          )
          run_path = Path("src/verification_job_run.rs")
          run = run_path.read_text()
          run, count = re.subn(
              r'(?m)^(\s*)analysis: Some\("proposition-expression"\.to_owned\(\)\),\n(?!\1backend:)',
              lambda m: f'{m.group(1)}analysis: Some("proposition-expression".to_owned()),\n{m.group(1)}backend: None,\n',
              run,
          )
          if count != 1:
              raise SystemExit(f"verification_job_run.rs: expected proposition envelope anchor, patched {count}")
          run_path.write_text(run)
          PY
      - name: Commit source integration
        shell: bash
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/verification_job.rs src/lib.rs src/verification_result.rs src/verification_job_run.rs
          git commit -m "Integrate action-temporal verification jobs"
          git push origin HEAD:feature/milestone-62-action-temporal-jobs
