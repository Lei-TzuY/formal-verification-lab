name: M62 format

on:
  push:
    branches:
      - feature/milestone-62-action-temporal-jobs

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/milestone-62-action-temporal-jobs
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format milestone 62 action-temporal jobs"
          git push origin HEAD:feature/milestone-62-action-temporal-jobs
