name: M56 integration patch

on:
  push:
    branches:
      - feature/milestone-56-structured-job-result

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/milestone-56-structured-job-result
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply asserted integration patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path("src/main.rs")
          text = main.read_text()

          old_import = '''use formal_verification_lab::{
              parse_declarative_document, parse_declarative_model, parse_verification_job,
          };
          use std::env;
          use std::fs;
          use std::path::Path;
          use std::process::ExitCode;
          '''
          new_import = '''use formal_verification_lab::verification_job_run::{
              load_verification_job, run_verification_job_json,
          };
          use formal_verification_lab::{parse_declarative_document, parse_declarative_model};
          use std::env;
          use std::fs;
          use std::process::ExitCode;
          '''
          assert text.count(old_import) == 1, "main import block drifted"
          text = text.replace(old_import, new_import)

          old_match = '''    match args {
                  [command, manifest_path] if command == "job" => run_verification_job(manifest_path),
          '''
          new_match = '''    match args {
                  [command, manifest_path, flag, format]
                      if command == "job" && flag == "--format" && format == "json" =>
                  {
                      run_verification_job_json_cli(manifest_path)
                  }
                  [command, manifest_path, flag, format]
                      if command == "job" && flag == "--format" =>
                  {
                      Err(format!("unsupported verification job format '{format}'; expected json"))
                  }
                  [command, manifest_path] if command == "job" => run_verification_job(manifest_path),
          '''
          assert text.count(old_match) == 1, "temporal job match block drifted"
          text = text.replace(old_match, new_match)

          old_job = '''fn run_verification_job(manifest_path: &str) -> Result<ExitCode, String> {
              let input = fs::read_to_string(manifest_path)
                  .map_err(|error| format!("failed to read verification job '{manifest_path}': {error}"))?;
              let job = parse_verification_job(&input).map_err(|error| error.to_string())?;
              let manifest = Path::new(manifest_path);
              let base = manifest.parent().unwrap_or_else(|| Path::new(""));
              let model = Path::new(job.model_path());
              let property = Path::new(job.property_path());
              let model = if model.is_absolute() {
                  model.to_path_buf()
              } else {
                  base.join(model)
              };
              let property = if property.is_absolute() {
                  property.to_path_buf()
              } else {
                  base.join(property)
              };
              let model = model
                  .to_str()
                  .ok_or_else(|| "resolved model path is not valid UTF-8".to_owned())?;
              let property = property
                  .to_str()
                  .ok_or_else(|| "resolved property path is not valid UTF-8".to_owned())?;
              run_multi_temporal_file(model, property, &job.option_args())
          }
          '''
          new_job = '''fn run_verification_job(manifest_path: &str) -> Result<ExitCode, String> {
              let loaded = load_verification_job(manifest_path).map_err(|error| error.to_string())?;
              run_multi_response(loaded.model, loaded.property, &loaded.job.option_args())
          }

          fn run_verification_job_json_cli(manifest_path: &str) -> Result<ExitCode, String> {
              let run = run_verification_job_json(manifest_path);
              println!("{}", run.to_json());
              Ok(ExitCode::from(run.exit_code))
          }
          '''
          assert text.count(old_job) == 1, "run_verification_job block drifted"
          text = text.replace(old_job, new_job)
          text = text.replace(
              "or 'job <manifest-path>'",
              "or 'job <manifest-path> [--format json]'",
          )
          main.write_text(text)

          lib = Path("src/lib.rs")
          text = lib.read_text()
          marker = "pub mod verification_job;\npub mod verification_result;\n"
          assert text.count(marker) == 1, "lib module marker drifted"
          text = text.replace(
              marker,
              "pub mod verification_job;\npub mod verification_job_run;\npub mod verification_result;\n",
          )
          marker = '''pub use verification_job::{
              parse_verification_job, VerificationJob, VerificationJobParseError,
              VerificationJobParseErrorKind,
          };
          '''
          assert text.count(marker) == 1, "lib verification_job export marker drifted"
          text = text.replace(
              marker,
              marker + '''pub use verification_job_run::{
              load_verification_job, run_verification_job_json, LoadedVerificationJob,
              VerificationJobJsonRun, VerificationJobLoadError,
          };
          ''',
          )
          lib.write_text(text)

          runner = Path("src/verification_job_run.rs")
          text = runner.read_text()
          old = "#[derive(Debug)]\npub struct LoadedVerificationJob {"
          assert text.count(old) == 1, "LoadedVerificationJob derive marker drifted"
          runner.write_text(text.replace(old, "pub struct LoadedVerificationJob {"))
          PY

          cargo fmt --all
          rm .github/workflows/m56-integrate.yml

          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate structured verification job CLI"
          git push origin HEAD:feature/milestone-56-structured-job-result
