name: M51 construction

on:
  push:
    branches:
      - feature/milestone-51-combined-fair-multi-response-cli
    paths:
      - .github/workflows/m51-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/milestone-51-combined-fair-multi-response-cli
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply M51 changes
        run: python .github/m51_apply.py
      - name: Format
        run: cargo fmt --all
      - name: Remove construction script
        run: rm .github/m51_apply.py
      - name: Commit coherent slice
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement Milestone 51 external multi-response fairness CLI"
          git push origin HEAD:feature/milestone-51-combined-fair-multi-response-cli
