name: M44 construction

on:
  push:
    branches:
      - feature/milestone-44-strong-fair-monitor-cli

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/milestone-44-strong-fair-monitor-cli
      - name: Apply M44 monitor CLI integration
        shell: python
        run: |
          from pathlib import Path

          main = Path('src/main.rs')
          text = main.read_text()

          old_reports = (
              'use formal_verification_lab::fairness_report::{\n'
              '    render_analysis_strong_fair_temporal_report, render_analysis_weak_fair_monitor_report,\n'
              '    render_analysis_weak_fair_temporal_report, render_bounded_strong_fair_temporal_report,\n'
              '    render_bounded_weak_fair_monitor_report, render_bounded_weak_fair_temporal_report,\n'
              '    render_strong_fair_temporal_report, render_weak_fair_monitor_report,\n'
              '    render_weak_fair_temporal_report,\n'
              '};'
          )
          new_reports = (
              'use formal_verification_lab::fairness_report::{\n'
              '    render_analysis_strong_fair_monitor_report, render_analysis_strong_fair_temporal_report,\n'
              '    render_analysis_weak_fair_monitor_report, render_analysis_weak_fair_temporal_report,\n'
              '    render_bounded_strong_fair_monitor_report, render_bounded_strong_fair_temporal_report,\n'
              '    render_bounded_weak_fair_monitor_report, render_bounded_weak_fair_temporal_report,\n'
              '    render_strong_fair_monitor_report, render_strong_fair_temporal_report,\n'
              '    render_weak_fair_monitor_report, render_weak_fair_temporal_report,\n'
              '};'
          )
          assert text.count(old_reports) == 1, 'fairness report import anchor drifted'
          text = text.replace(old_reports, new_reports)

          old_monitor_import = (
              'use formal_verification_lab::monitor_fairness::{\n'
              '    check_monitor_with_weak_fairness, check_monitor_with_weak_fairness_and_limits,\n'
              '    check_monitor_with_weak_fairness_and_product_limits,\n'
              '};'
          )
          new_monitor_import = old_monitor_import + (
              '\nuse formal_verification_lab::monitor_strong_fairness::{\n'
              '    check_monitor_with_strong_fairness, check_monitor_with_strong_fairness_and_limits,\n'
              '    check_monitor_with_strong_fairness_and_product_limits,\n'
              '};'
          )
          assert text.count(old_monitor_import) == 1, 'monitor fairness import anchor drifted'
          text = text.replace(old_monitor_import, new_monitor_import)

          old_reject = (
              '    if !options.strong_fairness.is_empty() {\n'
              '        return Err("strong fairness is not supported by monitor; use --weak-fair-action or omit fairness assumptions".to_owned());\n'
              '    }\n\n'
              '    if !options.fairness.is_empty() {'
          )
          strong_route = '''    if !options.strong_fairness.is_empty() {
              if options.has_model_limits {
                  let limits = AnalysisLimits::new(options.model_limits, options.product_limits);
                  let result = check_monitor_with_strong_fairness_and_limits(
                      &model,
                      &monitor,
                      &options.strong_fairness,
                      limits,
                  )
                  .map_err(|error| error.to_string())?;
                  print!(
                      "{}",
                      render_analysis_strong_fair_monitor_report(
                          model.name(),
                          &result,
                          &options.strong_fairness,
                      )
                  );
                  return Ok(match &result.outcome {
                      AnalysisOutcome::Conclusive(MonitorStatus::Satisfied) => ExitCode::SUCCESS,
                      AnalysisOutcome::Conclusive(MonitorStatus::Violated) => ExitCode::from(8),
                      AnalysisOutcome::Inconclusive(_) => ExitCode::from(3),
                  });
              }

              if options.has_product_limits {
                  let result = check_monitor_with_strong_fairness_and_product_limits(
                      &model,
                      &monitor,
                      &options.strong_fairness,
                      options.product_limits,
                  )
                  .map_err(|error| error.to_string())?;
                  print!(
                      "{}",
                      render_bounded_strong_fair_monitor_report(
                          model.name(),
                          &result,
                          &options.strong_fairness,
                      )
                  );
                  return Ok(match &result.outcome {
                      BoundedOutcome::Conclusive(MonitorStatus::Satisfied) => ExitCode::SUCCESS,
                      BoundedOutcome::Conclusive(MonitorStatus::Violated) => ExitCode::from(8),
                      BoundedOutcome::Inconclusive(_) => ExitCode::from(3),
                  });
              }

              let result = check_monitor_with_strong_fairness(
                  &model,
                  &monitor,
                  &options.strong_fairness,
              )
              .map_err(|error| error.to_string())?;
              print!(
                  "{}",
                  render_strong_fair_monitor_report(
                      model.name(),
                      &result,
                      &options.strong_fairness,
                  )
              );
              return Ok(match result.status {
                  MonitorStatus::Satisfied => ExitCode::SUCCESS,
                  MonitorStatus::Violated => ExitCode::from(8),
              });
          }

          if !options.fairness.is_empty() {'''
          assert text.count(old_reject) == 1, 'strong-fair monitor rejection anchor drifted'
          text = text.replace(old_reject, strong_route)
          main.write_text(text)

          Path('.github/workflows/m44-construction.yml').unlink()
      - name: Commit integration slice
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          cargo fmt --all
          git add src/main.rs .github/workflows/m44-construction.yml
          git commit -m "Wire strong-fair monitor CLI"
          git push origin HEAD:feature/milestone-44-strong-fair-monitor-cli
