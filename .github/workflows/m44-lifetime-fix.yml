name: M44 lifetime fix

on:
  push:
    branches:
      - feature/milestone-44-strong-fair-monitor-cli

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/milestone-44-strong-fair-monitor-cli
      - name: Apply compiler-required lifetime bound
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/main.rs')
          text = path.read_text()
          old = '    M: Clone + Eq + std::hash::Hash + std::fmt::Debug,\n'
          new = "    M: Clone + Eq + std::hash::Hash + std::fmt::Debug + 'static,\n"
          assert text.count(old) == 1, 'run_monitor generic bound anchor drifted'
          path.write_text(text.replace(old, new))
          Path('.github/workflows/m44-lifetime-fix.yml').unlink()
      - name: Commit exact fix
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          cargo fmt --all
          git add src/main.rs .github/workflows/m44-lifetime-fix.yml
          git commit -m "Fix strong-fair monitor CLI lifetime bound"
          git push origin HEAD:feature/milestone-44-strong-fair-monitor-cli
